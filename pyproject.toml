[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deep-pharma-starter"
version = "0.1.0"
description = "CPU multimodal drug-pair modeling and research tools for Deep-Pharma DataHack 3.0."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.3,<5",
  "kaggle>=1.7,<3",
  "kagglehub>=0.3,<1",
  "lightgbm>=4.6,<5",
  "matplotlib>=3.9,<4",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyyaml>=6.0,<7",
  "rdkit>=2026.3,<2027",
  "scikit-learn>=1.5,<2",
  "seaborn>=0.13,<1",
  "torch>=2.7,<3",
]

[project.scripts]
deep-pharma = "deep_pharma.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deep_pharma"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=work/pytest"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data", "outputs", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["I001"]
"reports/score_strategy/generate_report.py" = ["E501", "B905"]
"reports/lockbox_results/generate_report.py" = ["E501"]
"src/deep_pharma/rupture_benchmark.py" = ["E501"]
