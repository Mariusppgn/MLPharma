run_dir: outputs/graph/effect_graph_v1
train: data/raw/train.csv
manifest: artifacts/validation/pair_grouped_folds.csv
seed: 2026
cpu_threads: 2
features:
  text_hash_bins: 24
  fingerprint_bins: 16
  molecule_clusters: 4
structure:
  screening_neighbors: 6
  max_conditioning: 1
  max_conditioning_neighbors: 4
  alpha: 0.01
  min_expected: 3.0
  l1_c: 0.03
  coefficient_threshold: 0.03
  gate_dimensions: 3
  bic_max_parents: 2
  bic_max_steps: 60
bootstrap:
  iterations: 20
  unit: pair_group
  stability_default: 0.6
evaluation:
  enabled: true
  protocols: [pair_grouped, molecule_disjoint, leave_one_drug_out, scaffold_disjoint]
  outer_folds: [0, 1, 2, 3, 4]
  inner_splits: 3
  drug_holdout_fraction: 0.20
  leave_one_drug_count: 3
  min_rows: 40
  baseline_trees: 60
  baseline_leaves: 15
  rare_prevalence: 0.02
  classification_threshold: 0.5
  top_k: 5
dashboard:
  top_k: 100
  rare_prevalence: 0.02
  metadata_text_limit: 350
