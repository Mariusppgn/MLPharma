run_id: global_gnn_quick_fold0
seed: 2026

paths:
  train: data/raw/train.csv
  manifest: artifacts/validation/pair_grouped_folds.csv
  audit: artifacts/validation/pair_grouped_audit.json
  run_dir: artifacts/runs/global_gnn_quick_fold0
  output_oof: outputs/global_gnn/quick_oof_predictions.csv

model:
  device: cpu
  max_atoms: 256
  hidden_dim: 48
  gnn_layers: 2
  text_hash_dim: 32
  dropout: 0.15
  identity_dropout: 0.40
  identity_limit: 0.50

training:
  max_folds: 1
  max_epochs: 4
  min_epochs: 4
  patience: 4
  learning_rate: 0.002
  weight_decay: 0.0002
  gradient_clip_norm: 1.0
  severity_weight: 1.0
  binary_weight: 1.0
  prr_weight: 1.0
