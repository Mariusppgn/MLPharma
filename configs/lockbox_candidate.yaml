run_id: relational_binary_blended_prr_lockbox_v1
seed: 2026

paths:
  train: data/raw/train.csv
  test: data/raw/test.csv
  sample_submission: data/raw/sample_submission.csv
  baseline_config: configs/baseline.yaml
  prr_config: configs/prr_oof.yaml
  run_dir: artifacts/runs/relational_binary_blended_prr_lockbox_v1
  output_dir: outputs/lockbox_candidate
